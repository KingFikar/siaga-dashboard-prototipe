<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head><body>
<div class="chart-area" style="width:300px;height:200px">
  <canvas id="myChart"></canvas>
</div>
<script>
window.addEventListener('load', function(){
  try {
    var ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['R', 'M', 'L'],
        datasets: [{
          data: [127, 485, 1841],
          backgroundColor: ['#ef4444', '#f59e0b', '#10b981'],
          borderColor: '#fff', borderWidth: 2
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
    fetch('http://localhost:8766/probe',{method:'POST',body:JSON.stringify({result:'chart-created',w:document.getElementById('myChart').width,h:document.getElementById('myChart').height})});
  } catch (e) {
    fetch('http://localhost:8766/probe',{method:'POST',body:JSON.stringify({error:e.message,stack:e.stack})});
  }
});
</script>
</body></html>
